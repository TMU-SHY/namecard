<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Howard Yang｜臺北醫學大學</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ===== 北醫 CIS 色彩（依秘書處「北醫大識別系統」規範）=====
     標準色：紅褐色 Pantone 1815／RGB 143,40,39
     輔助特別色：金色 Pantone 876／RGB 150,106,81 */
  :root {
    --tmu-red: #8f2827;       /* 標準色：紅褐 */
    --tmu-red-dark: #6a1c1b;  /* 標準色加深（漸層用） */
    --tmu-gold: #966a51;      /* 輔助特別色：金 */
    --tmu-gold-light: #c9a88f;
    --ink: #2b2220;
    --muted: #6b5f5a;
    --paper: #fffdfb;
    --page: #f4efec;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--page);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
  }

  /* ===== 名片本體（桌機：橫式 9:5.4 比例）===== */
  .card {
    position: relative;
    width: 100%;
    max-width: 640px;
    aspect-ratio: 90 / 54;
    display: grid;
    grid-template-columns: 38% 1fr;
    background: var(--paper);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(106, 28, 27, .18), 0 4px 12px rgba(106, 28, 27, .08);
  }

  /* 左側品牌區 */
  .brand {
    position: relative;
    background: linear-gradient(160deg, var(--tmu-red) 0%, var(--tmu-red-dark) 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    overflow: hidden;
  }
  .brand::after {           /* 金色弧形裝飾 */
    content: "";
    position: absolute;
    width: 220px; height: 220px;
    right: -120px; bottom: -120px;
    border-radius: 50%;
    border: 18px solid var(--tmu-gold);
    opacity: .9;
  }
  .monogram {
    width: 92px; height: 92px;
    border-radius: 50%;
    border: 3px solid var(--tmu-gold-light);
    display: grid;
    place-items: center;
    font-family: "Montserrat", sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
  }
  .brand .school-en {
    font-family: "Montserrat", sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-align: center;
    text-transform: uppercase;
    opacity: .9;
    line-height: 1.5;
    position: relative;
    z-index: 1;
  }

  /* 右側資訊區 */
  .info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 32px 36px;
    position: relative;
  }
  .info::before {           /* 頂端色條 */
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--tmu-gold) 0 30%, var(--tmu-red) 30% 100%);
  }
  .name {
    font-family: "Montserrat", sans-serif;
    font-size: 34px;
    font-weight: 700;
    color: var(--tmu-red);
    line-height: 1.1;
  }
  .role {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 12px;
    background: var(--tmu-gold);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    border-radius: 999px;
    align-self: flex-start;
    letter-spacing: 2px;
  }
  .divider {
    width: 48px;
    height: 3px;
    background: var(--tmu-gold);
    margin: 22px 0 16px;
  }
  .school {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 2px;
  }
  .school-sub {
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted);
    font-family: "Montserrat", sans-serif;
  }

  .dept {
    margin-top: 6px;
    font-size: 15px;
    font-weight: 500;
    color: var(--tmu-red);
    letter-spacing: 1px;
  }
  .email {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    font-family: "Montserrat", sans-serif;
    font-size: 14px;
    color: var(--muted);
    text-decoration: none;
    word-break: break-all;
    align-self: flex-start;
  }
  .email svg { color: var(--tmu-gold); flex-shrink: 0; }
  .email:hover { color: var(--tmu-red); }

  /* ===== RWD：平板以下 ===== */
  @media (max-width: 640px) {
    .card { aspect-ratio: auto; }
    .name { font-size: 28px; }
    .info { padding: 28px 24px; }
    .monogram { width: 76px; height: 76px; font-size: 23px; }
  }

  /* ===== RWD：手機改為直式名片 ===== */
  @media (max-width: 480px) {
    .card {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      max-width: 360px;
    }
    .brand { padding: 32px 24px 28px; }
    .brand::after { width: 180px; height: 180px; right: -100px; bottom: -110px; }
    .info { padding: 32px 28px 36px; align-items: center; text-align: center; }
    .role, .email { align-self: center; }
    .info::before { height: 5px; }
    .name { font-size: 30px; }
  }
</style>
</head>
<body>
  <article class="card" aria-label="Howard Yang 電子名片">
    <div class="brand">
      <div class="monogram" aria-hidden="true">TMU</div>
      <div class="school-en">Taipei Medical<br>University</div>
    </div>
    <div class="info">
      <h1 class="name">Howard Yang</h1>
      <span class="role">在校生</span>
      <div class="divider"></div>
      <p class="school">臺北醫學大學</p>
      <p class="dept">醫務管理學系 30+ 大學專班</p>
      <a class="email" href="mailto:b931115009@tmu.edu.tw">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 6h18v12H3z M3 7l9 6 9-6"/></svg>
        b931115009@tmu.edu.tw
      </a>
    </div>
  </article>
</body>
</html>
